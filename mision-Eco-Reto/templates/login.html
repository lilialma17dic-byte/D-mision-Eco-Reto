<!DOCTYPE html><html><head><link rel="stylesheet" href="/static/style.css"></head><body>
<div class="login-wrap">
  <div class="login-left"><h1>Misión<br>Eco-Reto</h1><p>Pequeñas acciones<br><b>grandes cambios</b></p></div>
  <div class="login-right"><div class="card-login">
    <h2 style="text-align:center; color:var(--azul);">Iniciar sesión</h2>
    <form method="post">
      <input name="usuario" placeholder="Usuario" required>
      <input name="password" type="password" placeholder="Contraseña" required>
      <button class="btn-main">Entrar</button>
    </form>
    <p style="text-align:center;">¿No tienes cuenta? <a href="/register" style="color:var(--morado); font-weight:bold;">Regístrate</a></p>
  </div></div>
</div></body></html>
