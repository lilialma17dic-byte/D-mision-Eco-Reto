<!DOCTYPE html><html><head><link rel="stylesheet" href="/static/style.css"></head><body>
<div class="login-wrap">
  <div class="login-left"><h1>Misión<br>Eco-Reto</h1><p>Crea tu cuenta<br><b>y ayuda al planeta</b></p></div>
  <div class="login-right"><div class="card-login">
    <h2 style="text-align:center; color:var(--morado);">Registrarse</h2>
    <form method="post" action="/register">
      <input name="usuario" placeholder="Nuevo usuario" required>
      <input name="password" type="password" placeholder="Nueva contraseña" required>
      <button class="btn-main" style="background: linear-gradient(90deg, var(--morado), var(--verde));">Crear cuenta</button>
    </form>
    <p style="text-align:center;">¿Ya tienes cuenta? <a href="/login" style="color:var(--azul);">Inicia sesión</a></p>
  </div></div>
</div></body></html>
